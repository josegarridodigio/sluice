# =============================================================================
# Pando Configuration File
# =============================================================================
# Pando looks for this file in (highest priority first):
#   1. Current working directory  (.pando.toml)
#   2. Any parent directory, walking up to the filesystem root, stopping at
#      $HOME. Only files the user can read AND write are used, so one config
#      at the top of a workspace can serve every project below it.
#      Set PANDO_CONFIG_PARENT_SEARCH=false to disable this upward search.
#   3. $HOME/.config/pando/.pando.toml
#   4. $HOME/.pando.toml
#
# Environment variables prefixed with PANDO_ override any value here.
# Example: PANDO_DEBUG=true overrides Debug = false
# =============================================================================

WorkingDir = ''
Debug      = false
LogFile    = ''
DebugLSP   = false
AutoCompact  = true

# Leave ContextPaths unset to keep the built-in project instruction files
# such as AGENTS.md, PANDO.md, and CLAUDE.md enabled.
# Example:
# ContextPaths = ['./docs', './specs']

WatchExclude = ["target", ".pando", "refs"]

[Data]
Directory = './.pando/data'

# =============================================================================
# MCP Servers (Model Context Protocol)
# =============================================================================
# [MCPServers]
# [MCPServers.my-tool]
# Type    = 'stdio'
# Command = 'my-mcp-server'
# Args    = []

# =============================================================================
# LLM Providers — add API keys here or use environment variables.
# =============================================================================
[Providers]

# Nothing is enabled by default: declare only the providers you actually use.
# A provider section written here is treated as configured, so leaving one in
# place with an empty key makes Pando advertise an account that cannot be used.
# [Providers.anthropic]
# APIKey   = ''
# BaseURL  = ''
# Disabled = false

# [Providers.openai]
# APIKey   = ''
# Disabled = false

# [Providers.copilot]
# Disabled = false

# [Providers.ollama]
# BaseURL  = 'http://localhost:11434'
# Disabled = false

# [Providers.llama-cpp]
# BaseURL  = 'http://localhost:8080'
# Disabled = false

# =============================================================================
# Model metadata catalog (models.dev)
# =============================================================================
# Most providers do not report pricing or real context limits in their model
# listing API, so Pando completes that metadata from https://models.dev. The
# catalog is downloaded once per instance and cached in ~/.pando_modelsdev.json
# for 24 h; if it cannot be reached, models simply keep whatever their provider
# reported (no cost shown), exactly as before.
# [ModelsDev]
# Enabled = false   # never contact models.dev

# =============================================================================
# Language Server Protocol (LSP)
# =============================================================================
# Language servers are activated on demand: when you edit a file, Pando starts
# the matching server from its built-in catalogue (gopls, pyright, typescript-
# language-server, rust-analyzer, clangd, jdtls, ...) if the binary is on PATH.
# LSPAutoActivate = false   # set to disable on-demand activation entirely
#
# LSPActivateOn selects which events may start a server:
#   "edits"     (default) files Pando edits, plus an explicit diagnostics call
#   "reads"     also files read or opened in the viewer/file tree
#   "workspace" also files changed outside Pando (watches the whole workspace)
#   "off"       nothing starts on demand
# LSPActivateOn = "edits"
#
# Servers distributed as npm packages (pyright, typescript-language-server,
# yaml/json/html/css, bash, intelephense, ...) are installed automatically with
# bun or npm into ~/.config/pando/lsp when they are missing. Servers that ship
# with a toolchain (gopls, rust-analyzer, clangd, ...) are never installed:
# Pando reports the command you should run instead.
# LSPAutoInstall    = true
#
# LSPRunner picks the package manager used for those installs:
#   "auto" (default) bun when it is installed, npm/npx otherwise
#   "bun"            only bun
#   "npm"            only npm/npx, even when bun is installed
#   "off"            neither, so npm servers are only used if already on PATH
# LSPRunner         = "auto"
# LSPStartupTimeout = "20s"    # how long a tool waits for a server to be ready
# LSPInstallTimeout = "120s"   # extended wait while a server is being installed
#
# WatchExclude adds directories the file watchers (code index, LSP) never watch,
# on top of the built-in defaults (node_modules, DerivedData, Pods, ...) and
# .gitignore/.pandoignore. Names or doublestar globs relative to the workspace.
# WatchExclude = ["mobile-app/www/svg", "**/generated"]
#
# A few presets are opt-in and stay off until you declare them here, because
# they need project configuration or compete with a general-purpose server:
# eslint-language-server, biome, sql-language-server and deno. Declaring the
# section is enough to enable them, e.g. an empty [LSP.biome].
[LSP]

# Override a preset, or add your own server. Set Autostart = true to start a
# server eagerly at boot instead of waiting for a matching file. Empty fields
# (Command/Args/Languages/Filenames) are inherited from the preset of the same
# name. Filenames match by base name, for files whose extension says nothing
# (Dockerfile, CMakeLists.txt, Gemfile).
# [LSP.gopls]
# Disabled  = false
# Autostart = false
# Command   = 'gopls'
# Args      = []
# Languages = ['.go']
# Filenames = []

# =============================================================================
# Agents — configure the model for each role.
# Model format: '<provider>.<model-id>'
# =============================================================================
[Agents]

[Agents.coder]
Model       = ''
MaxTokens   = 0 # Auto (resolved by agent role and model; 0 = 8192 for coder)
# AutoCompact = true # optional per-agent override; when omitted the global AutoCompact applies

[Agents.summarizer]
Model     = ''
MaxTokens = 0 # Auto (resolved by agent role and model; 0 = 4096 for summarizer)

[Agents.task]
Model     = ''
MaxTokens = 0 # Auto (resolved by agent role and model; 0 = 2048 for task)

# =============================================================================
# Skills
# =============================================================================
[Skills]
Enabled = true
Paths   = ['./agents/skills']

[SkillsCatalog]
Enabled    = true
BaseURL    = ''
AutoUpdate = false
DefaultScope = 'global'

# =============================================================================
# TUI
# =============================================================================
[TUI]
Theme = 'pando-nobg'
ShowHiddenFiles = true
NerdFonts = true

# =============================================================================
# Permissions
# =============================================================================
[Permissions]
AutoApproveTools = true

# =============================================================================
# Goal / Autopilot Mode
# =============================================================================
[Goal]
MaxIterations   = 20
MaxDuration     = '1h'
StallIterations = 3
AutoApprove     = true
DangerousPatterns = []

# =============================================================================
# Mesnada — Multi-Agent Orchestrator
# =============================================================================
[Mesnada]
Enabled = true

# =============================================================================
# CronJobs — scheduled Mesnada/Pando tasks
# =============================================================================
# [CronJobs]
# Enabled = true
# [[CronJobs.Jobs]]
# Name = 'daily-review'
# Schedule = '0 9 * * 1-5'
# Prompt = 'Review today''s git log and summarize in DAILY_REPORT.md'
# Enabled = true
# Engine = 'pando'
# Tags = ['daily']
# Timeout = '10m'

[Mesnada.Server]
Host = ''
Port = 5005

[Mesnada.Orchestrator]
StorePath        = './.pando/mesnada/tasks.json'
LogDir           = './.pando/mesnada/logs'
# MaxParallel caps how many tasks run at once; over the cap a ready task queues
# and starts as soon as a slot frees. MaxPerEngine adds a per-engine cap (0 = no
# per-engine limit) so one engine's fan-out cannot take every slot.
MaxParallel      = 5
MaxPerEngine     = 0
# ClaimTTL bounds the reservation a dispatcher takes on a ready task so two
# concurrent readiness checks cannot start it twice; a claim that expires without
# the task starting is reclaimed by the dispatch tick, which runs every
# DispatchInterval and also starts tasks the caps had deferred.
ClaimTTL         = '2m'
DispatchInterval = '10s'
DefaultEngine    = 'pando'
DefaultModel     = 'sonnet'
# DefaultMCPConfig is optional. When unset, pando generates a dynamic MCP config
# at spawn time that includes pando itself (remembrances, mesnada, fetch, search,
# browser) plus any MCPServers defined in this config file.
# DefaultMCPConfig = '/path/to/custom-mcp-config.json'
PersonaPath      = './.pando/mesnada/personas'

[Mesnada.ACP]
Enabled        = true
DefaultAgent   = 'claude'
AutoPermission = true

[Mesnada.ACP.Server]
Enabled        = false
Transports     = ['http']
Host           = '0.0.0.0'
Port           = 8766
MaxSessions    = 100
SessionTimeout = '30m'
RequireAuth    = false

[Mesnada.TUI]
Enabled = true
WebUI   = false

[Mesnada.Delegation]
Enabled = true
InjectIntoLiveLoop = true
ResurrectIdleLoop = true
SynthesizeFallback = true
MaxResurrections = 4
MaxDepth = 3
MaxConcurrent = 8
ResurrectionTimeout = '10m'
ReuseWarmInstances = true
AutoStartWarmInstance = true
WarmInstanceIdleTimeout = '0'
WarmQueueDepth = 0
AllowExternalWarmTargets = false
AcceptDelegations = false
# Anti-hallucination gate: downgrade a delegated task's "success" conclusion to
# "partial" when the artifacts / memory refs it cites do not exist.
ConclusionGateDisabled = false
# Circuit breaker + respawn guard: refuse a relaunch/retry of a task that hit the
# consecutive-failure limit, failed on auth, or is inside a rate-limit cooldown.
BreakerDisabled = false
MaxTaskRetries = 3
RateLimitCooldown = '5m'
RecentSuccessWindow = '2m'
# Durable event log: every terminal task outcome is appended to disk before it is
# broadcast, and consumed through an acked cursor — so a signal dropped by the
# in-memory bus, or produced while pando was down, is delivered instead of lost.
EventLogDisabled = false
EventLogMaxEntries = 5000
# Swarm blackboard garbage collection. Past MaxEntriesPerSwarm a swarm's shared
# log is compacted to its newest entries while every key's winning value is kept,
# so no fact the merged view still shows is ever lost. A swarm's board is purged
# once its newest entry is older than BlackboardTtl (a finished swarm ages out).
BlackboardMaxEntriesPerSwarm = 200
BlackboardTtl = '168h'

# =============================================================================
# Shell & Bash
# =============================================================================
[Shell]
Path = ''
Args = []

[Bash]
BannedCommands  = []
AllowedCommands = []

# =============================================================================
# Caveman — Output brevity
# =============================================================================
# Reduces output-token usage by giving shorter explanations and removing filler.
# It keeps code, commands, errors, reasoning quality, tool use and verification
# intact. Savings apply to output tokens only; input and reasoning tokens are
# not reduced. Applies to sessions that have not chosen a level with /caveman.
# Valid: '' (off), 'lite', 'full', 'ultra'.
[Caveman]
DefaultMode = ''

# =============================================================================
# Remembrances — Semantic memory and knowledge base
# =============================================================================
[Remembrances]
Enabled = true
KBPath  = './kb'
KBAutoImport = true
KBWatch      = true
# Convert docx/pdf/xlsx/pptx/… dropped in the KB folder to Markdown on the fly,
# indexing chunks that reference the original file.
KBConvertDocuments = true
# Index [[wiki links]] written in KB documents as a navigable document graph
# (outgoing links, backlinks, related documents, undocumented concepts).
KBWikiLinks = true
ContextEnrichmentEnabled = true
ContextEnrichmentKBResults = 3
ContextEnrichmentCodeResults = 5
ContextEnrichmentCodeProject = ''
ContextEnrichmentMinScore = 0.45
# Ask the shared decision model (see [DecisionModel]) which retrieved snippets are useful
# for the request before they are injected. Fail-open: errors keep everything.
ContextEnrichmentDecisionFilterEnabled = false
MemoryContextDecisionFilterEnabled = false
ContextEnrichmentDecisionFilterThreshold = 0.60
ContextEnrichmentDecisionFilterMaxCandidates = 32
ContextEnrichmentDecisionFilterMaxCandidateChars = 400
# Inverted flag: false = only a local (ollama) decision model sees the snippets.
ContextEnrichmentDecisionFilterAllowHosted = false
# Run context enrichment as a separate agent loop on the 'context-enricher' model
# (see [Agents.context-enricher]) instead of the single-shot search pipeline.
# The loop calls the memory, knowledge-base and code-index tools iteratively and
# returns one enriched block; the main agent only sees that block.
ContextEnrichmentAgentLoopEnabled = false
ContextEnrichmentAgentLoopTimeoutSeconds = 60
ContextEnrichmentAgentLoopMaxChars = 6000
# Run the loop on every user turn instead of only on the first message of a session.
ContextEnrichmentAgentLoopEveryMessage = false
# Inverted flags (feature on by default):
ContextEnrichmentAgentLoopFallbackDisabled = false
ContextEnrichmentAgentLoopHiddenInChat = false
ContextEnrichmentAgentLoopSilent = false
MemoryEnabled = true
MemoryContextEnrichmentEnabled = true
MemoryContextMaxItems = 10
MemoryContextMaxChars = 2000
MemoryDefaultTTLDays = 180
MemoryGCInterval = '1h'

DocumentEmbeddingProvider = 'ollama'
DocumentEmbeddingModel    = 'qwen3-embedding:0.6b'
DocumentEmbeddingBaseURL  = 'http://127.0.0.1:11435'
DocumentEmbeddingAPIKey   = ''

CodeEmbeddingProvider = 'ollama'
CodeEmbeddingModel    = 'hf.co/ggml-org/jina-embeddings-v2-base-code-Q8_0-GGUF:Q8_0'
CodeEmbeddingBaseURL  = 'http://127.0.0.1:11435'
CodeEmbeddingAPIKey   = ''

UseSameModel = false
ChunkSize    = 800
ChunkOverlap = 100
IndexWorkers = 4

# =============================================================================
# LLM Cache
# =============================================================================
[LLMCache]
Enabled = true

# =============================================================================
# Tool Discovery
# =============================================================================
[ToolDiscovery]
Enabled = true
Mode = 'auto'
MaxDirectTools = 64
SearchLimit = 8

# =============================================================================
# Internal Tools
# =============================================================================
[InternalTools]
FetchEnabled            = true
FetchMaxSizeMB          = 10
GoogleSearchEnabled     = true
GoogleAPIKey            = ''
GoogleSearchEngineID    = ''
BraveSearchEnabled      = true
BraveAPIKey             = ''
PerplexitySearchEnabled = true
PerplexityAPIKey        = ''
ExaSearchEnabled        = false
ExaAPIKey               = ''
SourcegraphEnabled      = false
SourcegraphToken        = ''
Context7Enabled         = true
BrowserEnabled          = true
BrowserType             = 'chrome' # chrome, msedge, chromium, opera, lightpanda, obscura
                                    # lightpanda and obscura are CDP-server browsers: Pando launches
                                    # them as a background process and drives them over a WebSocket,
                                    # instead of launching a Chromium executable directly.
BrowserExecutable       = ''
BrowserHeadless         = true
BrowserTimeout          = 30
BrowserUserDataDir      = ''
BrowserMaxSessions      = 3
DesktopEnabled          = false
DesktopBackend          = 'auto'
DesktopAllowPhysicalInput = true
DesktopMaxNodes         = 500
DesktopDefaultDepth     = 3
DesktopActionTimeout    = 10
DesktopSnapshotTTL      = 60
DesktopScreenshotScale  = 1.0
DesktopAllowedApps      = []
DesktopDeniedApps       = []

# =============================================================================
# Self-Improvement Evaluator
# =============================================================================
[Evaluator]
Enabled = true
AlphaWeight = 0.8
BetaWeight = 0.2
ExplorationC = 1.41
MinSessionsForUCB = 5
MaxTokensBaseline = 50
MaxSkills = 100
Async = true

# =============================================================================
# API Server (Web UI backend)
# =============================================================================
[Server]
Enabled     = true
Host        = 'localhost'
Port        = 9999
RequireAuth = false

# WebUI Access — username/password protection for the HTTP API.
# Only enforced once the server is exposed, i.e. started on a non-loopback Host
# (e.g. --host 0.0.0.0). Bound to localhost it stays inert. Where the request
# comes from makes no difference: on an exposed server the local browser signs in
# too. Manage users from the Web UI (Settings -> Services -> WebUI Access);
# passwords are stored age-encrypted, like provider API keys.
[Server.BasicAuth]
Enabled = false
# [[Server.BasicAuth.Users]]
# Username = 'admin'
# Password = 'age1:...'

# =============================================================================
# Container Runtime
# =============================================================================
[Container]
Runtime         = 'host'
Image           = ''
PullPolicy      = 'if-not-present'
Socket          = ''
WorkDir         = ''
Network         = 'none'
ReadOnly        = true
User            = ''
CPULimit        = ''
MemLimit        = ''
PidsLimit       = 512
NoNewPrivileges = true
AllowEnv        = []
AllowMounts     = []
ExtraEnv        = []
ExtraMounts     = []
EmbeddedCacheDir = ''
EmbeddedGCKeepN  = 5

# =============================================================================
# Lua scripting
# =============================================================================
[Lua]
Enabled         = false
ScriptPath      = ''
Timeout         = ''
StrictMode      = false
HotReload       = false
LogFilteredData = false

# =============================================================================
# MCP Gateway
# =============================================================================
[MCPGateway]
Enabled            = true
FavoriteThreshold  = 3
MaxFavorites       = 10
FavoriteWindowDays = 7
DecayDays          = 30

# =============================================================================
# Snapshots
# =============================================================================
[Snapshots]
Enabled          = false
MaxSnapshots     = 50
MaxFileSize      = '10MB'
ExcludePatterns  = []
AutoCleanupDays  = 30

# =============================================================================
# CLI Assist
# =============================================================================
[cliAssist]
Model   = ''
Timeout = 0

# =============================================================================
# Persona Auto-Select
# =============================================================================
[PersonaAutoSelect]
Enabled     = false
PersonaPath = ''

# =============================================================================
# Model Auto Mode — route each prompt to a model chosen by a small decision model
# (System One: Ollama >= 0.35, TypeSafe Jev or a custom Jev-compatible gateway)
# =============================================================================
[ModelAutoMode]
Enabled       = false
DefaultAuto   = true
Threshold     = 0.6
MinConfidence = 0.0
HistoryPrompts = 0

# [[ModelAutoMode.Routes]]
# ID          = 'hard-coding'
# Description = 'Complex refactors, architecture and debugging'
# Model       = 'anthropic.claude-sonnet-4'
# Fallbacks   = []

# =============================================================================
# Decision Model — shared System One / Jev decision provider (model auto mode,
# persona auto-select). Ollama >= 0.35, TypeSafe Jev or a custom Jev gateway.
# =============================================================================
[DecisionModel]
TimeoutMs = 0

[DecisionModel.Router]
Provider  = 'ollama'
Model     = ''
KeepAlive = '30m'

# =============================================================================
# ACP (Agent Client Protocol)
# =============================================================================
[acp]
enabled         = false
max_sessions    = 0
idle_timeout    = ''
log_level       = ''
auto_permission = false

# =============================================================================
# Projects — Multi-project management
# =============================================================================
[Projects]
Enabled           = true
AutoRestore       = false
MaxProjects       = 20
MaxWebInstances   = 6
WebStartupTimeout = '20s'
