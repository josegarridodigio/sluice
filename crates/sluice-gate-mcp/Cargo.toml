[package]
name = "sluice-gate-mcp"
description = "Internal MCP server of Sluice: a thin client of the daemon that gives coding agents a blocking verify tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sluice-gate-mcp"
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
anyhow.workspace = true
humantime = "2.4.0"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sluice-gate-core.workspace = true
sluice-gate-proto = { workspace = true, features = ["client"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
