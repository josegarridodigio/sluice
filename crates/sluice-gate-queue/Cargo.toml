[package]
name = "sluice-gate-queue"
description = "Internal local merge queue of Sluice: trains, human approval, crash-safe push and reconcile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sluice-gate-queue"
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
sluice-gate-core.workspace = true
sluice-gate-proto.workspace = true
sluice-gate-daemon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex = "0.4.3"
humantime = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros"] }

[lints]
workspace = true
