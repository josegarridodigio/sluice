[package]
name = "sluice-gate"
description = "Sluice: a stack-agnostic verification queue and cache for parallel coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["signal", "process", "fs", "socket"] }
serde_json = "1.0.154"
sluice-gate-core.workspace = true
sluice-gate-daemon.workspace = true
sluice-gate-mcp.workspace = true
sluice-gate-proto = { workspace = true, features = ["client"] }
sluice-gate-queue.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rmcp = { version = "3.6.0", features = ["client", "transport-child-process"] }
tempfile.workspace = true

[lints]
workspace = true
