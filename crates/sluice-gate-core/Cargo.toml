[package]
name = "sluice-gate-core"
description = "Internal core library of Sluice: gate configuration, git tree hashing, cache keys and result markers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sluice-gate-core"
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
directories = "6.0.0"
hex = "0.4.3"
humantime = "2.4.0"
humantime-serde = "1.1.1"
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror.workspace = true
toml = "1.1.8"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
