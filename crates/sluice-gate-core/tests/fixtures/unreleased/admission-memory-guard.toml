# Written for 0.6.0 (ADR-0019 piece 7): `[admission] memory_guard`, the opt-in
# Sluice-side guard that cancels Sluice's own largest gate job under real
# memory exhaustion (off by default). Not a recording of a released binary;
# 0.5.0 and older reject this file because `[admission]` refuses unknown keys.
version = 1

[admission]
memory_guard = true
memory_reserve = "3G"
