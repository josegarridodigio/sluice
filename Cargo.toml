[workspace]
resolver = "3"
members = [
    "crates/sluice-gate-core",
    "crates/sluice-gate-proto",
    "crates/sluice-gate-daemon",
    "crates/sluice-gate-mcp",
    "crates/sluice-gate-queue",
    "crates/sluice-gate",
]

[workspace.package]
version = "0.6.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Jose Antonio Garrido <josegarrido@digio.es>"]
repository = "https://github.com/josegarridodigio/sluice"
homepage = "https://github.com/josegarridodigio/sluice"
keywords = ["git", "hooks", "cache", "agents", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Internal crates
sluice-gate-core = { path = "crates/sluice-gate-core", version = "0.6.3" }
sluice-gate-proto = { path = "crates/sluice-gate-proto", version = "0.6.3" }
sluice-gate-daemon = { path = "crates/sluice-gate-daemon", version = "0.6.3" }
sluice-gate-mcp = { path = "crates/sluice-gate-mcp", version = "0.6.3" }
sluice-gate-queue = { path = "crates/sluice-gate-queue", version = "0.6.3" }

# External crates (versions are re-checked when a crate first uses them)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# Dev dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately relax.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
