# Sluice verifies itself. These gates run from the repository's own hooks
# (see .githooks/ and CONTRIBUTING.md) and from the validation benchmark.
# The gates are path-scoped (Sluice >= 0.3.0): documentation, KB and
# harness-only changes keep the cached passes.
version = 1

[defaults]
agent_hook_policy = "fail-fast"
human_hook_policy = "wait"

[gates.fmt]
cmd = "cargo fmt --all --check"
weight = 1
timeout = "2m"
hooks = ["pre-commit"]
key_inputs = ["rustc --version"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "plugin/**"]

[gates.clippy]
cmd = "cargo clippy --workspace --all-targets -- -D warnings"
weight = 4
timeout = "15m"
hooks = ["pre-commit"]
key_inputs = ["rustc --version"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "plugin/**"]

[gates.test]
cmd = "cargo test --workspace"
weight = 6
timeout = "30m"
hooks = ["pre-push"]
key_inputs = ["rustc --version"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "plugin/**"]
